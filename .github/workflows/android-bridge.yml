name: Eversense Bridge (Android)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-bridge.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-bridge.yml'
  workflow_dispatch:

concurrency:
  group: android-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, unit + Robolectric tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.BRIDGE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bridge.jks"
            echo "BRIDGE_KEYSTORE_FILE=$RUNNER_TEMP/bridge.jks" >> "$GITHUB_ENV"
            echo "Signing with the BRIDGE_KEYSTORE_B64 key"
          else
            echo "::warning::BRIDGE_KEYSTORE_B64 not set: APK is signed with a throwaway debug key, so it will not install over a build signed with another key."
          fi

      - name: Test, lint and assemble
        env:
          BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.BRIDGE_KEYSTORE_PASSWORD }}
        run: >
          ./gradlew --no-daemon --stacktrace
          :core:test
          :app:testDebugUnitTest
          :app:lintRelease
          :app:assembleRelease
          :fake-eversense:assembleDebug

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          tot = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for p in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              head = open(p, encoding="utf-8").read(4000)
              for k in tot:
                  m = re.search(r'\b%s="(\d+)"' % k, head)
                  if m: tot[k] += int(m.group(1))
          print("JVM test totals:", tot)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: eversense-bridge-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fake-eversense-test-double-apk
          path: android/fake-eversense/build/outputs/apk/debug/fake-eversense-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            android/*/build/reports/
            android/*/build/test-results/

  e2e:
    name: Emulator end-to-end (Android 15)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: eversense-bridge-apk
          path: apks

      - uses: actions/download-artifact@v4
        with:
          name: fake-eversense-test-double-apk
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: bash android/e2e/run-e2e.sh apks/app-release.apk apks/fake-eversense-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-saved-log-file
          path: e2e-out/
          if-no-files-found: ignore

  release:
    name: Publish APK (download link)
    # Only builds that passed every unit, Robolectric, lint and emulator check reach the phone.
    needs: [build-test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eversense-bridge-apk
          path: apks

      - name: Replace the bridge-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apks/app-release.apk eversense-bridge.apk
          gh release delete bridge-latest --cleanup-tag --yes || true
          gh release create bridge-latest eversense-bridge.apk \
            --target "$GITHUB_SHA" \
            --title "Eversense Bridge (build ${{ github.run_number }})" \
            --notes "Tap **eversense-bridge.apk** below on your phone to download, then open it to install or update.

          Build ${{ github.run_number }} from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}. Passed all unit, Robolectric, lint and Android 15 emulator end-to-end tests.

          Direct link: https://github.com/${{ github.repository }}/releases/download/bridge-latest/eversense-bridge.apk"
