name: Meanwhile (web)

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'scripts/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'scripts/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Countdown and poll timing, reading sync, the in-app (native) paths, and
      # restoring a backup into an app that already holds data.
      - name: Unit tests
        run: npm test

      - name: Build (website)
        run: npm run build

      - name: Build (pages for the Android app)
        run: npm run build:app
